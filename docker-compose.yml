services:
  dealhawk:
    build: .
    container_name: dealhawk
    restart: unless-stopped
    # Chromium's helpers end up as PID 1's children, and node doesn't reap them.
    init: true
    mem_limit: 2g
    ports:
      - "3082:3000"
    env_file:
      - .env
    volumes:
      - /mnt/user/junk/dealhawk-images:/app/data/images
    # Chromium's profile, disk cache and shared-memory files (--disable-dev-shm-usage
    # redirects those here). RAM-backed so they never reach the writable layer or
    # wear the array, and cleared on every restart. It counts against mem_limit.
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
